# Регулярный аудит производительности: Lighthouse по страницам приложения и автосоздание issue.
# ЧЕРНОВИК: у GitHub App нет права `workflows`, поэтому файл лежит здесь. Человеку нужно
# перенести его в .github/workflows/audit.yml. Описание — README.md, «Агент в GitHub» → «Регулярный аудит».
name: audit

on:
  schedule:
    # Раз в сутки, 06:17 МСК (время в UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      training:
        description: 'Учебный прогон: добавить в сводку одну подготовленную находку'
        type: boolean
        default: false

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  # Без модели: будит приложение, гоняет Lighthouse, готовит сводку.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APP_URL: ${{ vars.APP_URL }}
      TRAINING: ${{ inputs.training }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare report dir
        run: mkdir -p audit-report

      - name: Wake up app
        id: wake
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::infra: не задана переменная vars.APP_URL"
            exit 1
          fi
          # Render free засыпает: повторы до ~3 минут (18 попыток по 10 секунд).
          ok=false
          for i in $(seq 1 18); do
            if curl -fsS -o /dev/null --max-time 15 "$APP_URL/"; then ok=true; break; fi
            echo "Попытка $i: приложение не ответило"
            sleep 10
          done
          echo "available=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            {
              echo "# Аудит производительности"
              echo
              echo "Приложение: $APP_URL"
              echo "Прогон: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo "**Нет данных: приложение недоступно.** Это не означает, что проблем нет."
            } > audit-report/summary.md
          fi

      - uses: actions/setup-node@v6
        if: steps.wake.outputs.available == 'true'
        with:
          node-version: '22'

      - name: Lighthouse CI
        if: steps.wake.outputs.available == 'true'
        run: |
          npx --yes @lhci/cli@0.15.1 collect \
            --url="$APP_URL/" --url="$APP_URL/admin" \
            --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox --headless=new"
          npx --yes @lhci/cli@0.15.1 upload \
            --target=filesystem --outputDir=audit-report

      - name: Summary
        if: steps.wake.outputs.available == 'true'
        run: |
          {
            echo "# Аудит производительности"
            echo
            echo "Приложение: $APP_URL"
            echo "Прогон: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            for f in audit-report/lhr-*.json; do
              jq -r '
                def page: (.requestedUrl | sub("^https?://[^/]+"; "") | sub("/+$"; "")) as $p
                  | if $p == "" then "home" else ($p | ltrimstr("/")) end;
                "\n## Страница: \(page) (\(.requestedUrl))\n",
                "Оценки категорий (0–100):",
                (.categories | to_entries[] | "- \(.key): \((.value.score // 0) * 100 | round)"),
                "\nПроваленные аудиты (оценка < 0.9), ключ `lighthouse/\(page)/<id>`:",
                ( [ .audits[]
                    | select(.score != null and .score < 0.9
                             and (.scoreDisplayMode | IN("binary","numeric","metricSavings"))) ]
                  | if length == 0 then "- нет"
                    else .[] | "- `\(.id)` — \(.title): \(.displayValue // (.numericValue | tostring))" end )
              ' "$f"
            done
            if [ "$TRAINING" = true ]; then
              echo
              echo "## УЧЕБНАЯ НАХОДКА (не дефект приложения)"
              echo
              echo "Ключ: \`training/demo-finding\`"
              echo "Находка для отработки процесса: «Демонстрационная находка: пример записи аудита»."
              echo "Значение: 1234 мс (выдуманное). Предлагаемое действие: ничего, закрыть после проверки процесса."
            fi
          } > audit-report/summary.md

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: audit-${{ github.run_id }}
          path: audit-report/
          retention-days: 30
          if-no-files-found: warn

  # Модель читает только сводку и работает с issue; код не меняет.
  analyze:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: audit-${{ github.run_id }}
          path: audit-report

      - name: Secret is set (infra)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::infra: нет секрета"; exit 1; }

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ vars.APP_URL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ты разбираешь результаты аудита производительности (Lighthouse) в ${{ github.repository }}.
            Приложение: ${{ vars.APP_URL }}. Ссылка на прогон: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            1. Прочитай audit-report/summary.md (Read). Весь JSON не нужен.
            2. Во всех issue и комментариях указывай, какое приложение (URL) и какой прогон проверялись, с этой ссылкой на прогон.
            3. У каждой находки стабильный ключ: `lighthouse/<страница>/<audit-id>` (страница — как в сводке) или `training/demo-finding` для учебной.
            4. Перед созданием ищи существующие: `gh issue list --label audit --state all --search "<ключ>"`
               (при необходимости открой через `gh issue view`; ориентируйся на строку `audit-key: <ключ>` в тексте).
               - Есть открытая и новых сведений нет — ничего не создавай и не комментируй.
               - Есть открытая, но сведения новые (значение заметно изменилось) — один комментарий в неё.
               - Нет открытой — создай issue (`gh issue create`): метки `audit`, `needs-triage` (+ `training` для учебной);
                 в тексте — проблема, предлагаемое действие, ссылка на прогон, URL приложения и отдельная строка `audit-key: <ключ>`.
                 Учебная находка явно помечена как учебная и в заголовке, и в тексте.
            5. Не больше 3 новых issue за прогон — выбирай самые значимые находки.
            6. Если в сводке «нет данных: приложение недоступно» — это не значит, что проблем нет; issue по находкам не создавай.
            7. Итог прогона (найдено / ничего не найдено / нет данных; какие issue созданы или пропущены как дубли; ссылка на прогон)
               добавь комментарием в issue «Журнал аудита производительности» (найди по заголовку:
               `gh issue list --label audit --state all --search "Журнал аудита производительности in:title"`;
               нет — создай с меткой `audit`). Этот же итог выведи финальным ответом — он попадёт в step summary.
            8. Код не меняй, ветки и PR не создавай: решение о реализации принимает человек.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*)"
